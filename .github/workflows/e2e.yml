name: E2E & API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:00 WIB tiap hari — menangkap kerusakan yang muncul dari perubahan
    # di CMS atau di hosting, bukan dari commit.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL yang diuji'
        required: false
        default: 'https://headless-wp-nextjs-demo.vercel.app'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependency
        run: npm ci || npm install

      - name: Pasang browser Playwright
        run: npx playwright install --with-deps chromium

      - name: Jalankan test
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://headless-wp-nextjs-demo.vercel.app' }}
        run: npx playwright test

      - name: Simpan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Simpan jejak kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-gagal
          path: test-results/
          retention-days: 7
